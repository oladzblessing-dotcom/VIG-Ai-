<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in to VIG Ai</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css"></head><body><div class="wrap">
<div class="top"><a class="logo" href="/">VIG Ai</a></div>
<form class="card auth" id="f">
<h3 id="title" style="font-size:24px;margin:0"></h3>
<div id="gwrap" class="gwrap" hidden></div><div class="or" id="orline" hidden>or use email</div>
<label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" minlength="8" required>
<div class="err" id="err" role="alert"></div>
<button class="btn" id="go" type="submit"></button>
<p class="sub" style="font-size:15px;margin:16px 0 0;text-align:center"><span id="alt"></span> <button class="link" type="button" id="tog"></button></p>
<p class="sub" style="font-size:13px;margin:12px 0 0;text-align:center">By continuing you agree to our <a href="/terms.html">Terms</a> and <a href="/privacy.html">Privacy Policy</a>.</p>
</form></div>
<script>
let signup=new URLSearchParams(location.search).get('mode')==='signup';
const $=id=>document.getElementById(id);
function paint(){$('title').textContent=signup?'Create your account':'Welcome back';
 $('go').textContent=signup?'Create account (2 free creations)':'Log in';
 $('alt').textContent=signup?'Already have an account?':'New here?';
 $('tog').textContent=signup?'Log in':'Create an account';
 $('pw').autocomplete=signup?'new-password':'current-password';$('err').textContent=''}
$('tog').onclick=()=>{signup=!signup;paint()};
$('f').onsubmit=async e=>{e.preventDefault();$('go').disabled=true;$('err').textContent='';
 try{const r=await fetch(signup?'/api/signup':'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('pw').value})});
  const d=await r.json();if(!r.ok)throw new Error(d.error||'Something went wrong');location.href='/app.html'}
 catch(x){$('err').textContent=x.message;$('go').disabled=false}};
async function gLogin(cred){$('err').textContent='';
 try{const r=await fetch('/api/google',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credential:cred})});
  const d=await r.json();if(!r.ok)throw new Error(d.error);location.href='/app.html'}
 catch(x){$('err').textContent=x.message||'Google sign-in failed'}}
(async()=>{let cfg={};try{cfg=await(await fetch('/api/config')).json()}catch(e){}
 if(!cfg.googleClientId)return;$('gwrap').hidden=false;$('orline').hidden=false;
 if(window.__PREVIEW){$('gwrap').innerHTML='<button type="button" class="gbtn" id="gfake"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Continue with Google</button>';$('gfake').onclick=()=>gLogin('preview');return}
 const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;
 s.onload=()=>{google.accounts.id.initialize({client_id:cfg.googleClientId,callback:x=>gLogin(x.credential)});
  google.accounts.id.renderButton($('gwrap'),{theme:'outline',size:'large',text:'continue_with',width:Math.min(340,$('gwrap').clientWidth||340)})};
 document.head.appendChild(s)})();
paint();
</script></body></html>
